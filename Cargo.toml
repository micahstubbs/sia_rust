[package]
name = "sia"
version = "0.4.0"
edition = "2021"
description = "SIA: Self-Improving AI framework (Rust port)"
license = "MIT"
default-run = "sia"

[[bin]]
name = "sia"
path = "src/bin/sia.rs"

# Differential-parity helper: emits the Rust output for an operation given a JSON
# request on stdin, so scripts/parity_check.py can diff Rust vs Python (issue #29).
[[bin]]
name = "sia-parity"
path = "src/bin/sia_parity.rs"

[lib]
name = "sia"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
clap = { version = "4", features = ["derive", "string"] }
include_dir = "0.7"
regex = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower = { version = "0.5", features = ["util"] }
mime_guess = "2"
rig-core = { version = "=0.22.0", optional = true }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "rustls-tls",
], optional = true }
glob = { version = "0.3", optional = true }
# Used by the structured-output rig `Extractor` wrapper (issue #47) to derive
# `JsonSchema` on `Answer`. Pinned to the same major as rig-core 0.22.0's
# dependency (schemars 1.x; cache has 1.2.1).
schemars = { version = "1", optional = true }
# OS-level filesystem confinement (issue #140, stage 2). Linux-only Landlock LSM
# bindings; behind the non-default `landlock-sandbox` feature so the default and
# `llm` builds gain no dependency. The crate compiles on all platforms but its
# enforcement is a graceful no-op off Linux / on kernels without Landlock.
landlock = { version = "0.4", optional = true }
# OS-level network-egress confinement (issue #140, stage 2b). seccomp-bpf syscall
# filter from the rust-vmm / Firecracker team (Apache-2.0 OR BSD-3-Clause); its only
# mandatory dependency is `libc`. Behind the non-default `seccomp-sandbox` feature so
# the default and `llm` builds gain no dependency. Linux-only; the crate compiles on
# any platform but its enforcement is a graceful no-op off Linux / on kernels without
# seccomp. Pinned to 0.5.x.
seccompiler = { version = "0.5", optional = true }
# Syscall numbers / constants (AF_INET, EACCES, SYS_socket) for the seccomp filter.
# Optional and pulled in only by `seccomp-sandbox`; it is already a transitive dep of
# seccompiler, so this adds nothing to the default / `llm` builds.
libc = { version = "0.2", optional = true }
# Native-Rust weight-update (LoRA fine-tuning) backend (issue #139). These are
# HuggingFace Candle crates — they are heavy and, critically, NOT present in this
# repo's offline cargo cache, and CI has no network to fetch new heavy deps. They
# are therefore declared `optional = true` and gated behind the non-default
# `weight-updates` feature, so the default and `llm` builds (and CI) never pull
# them in. The real `CandleLoRAWeightUpdater` lives behind that feature; the
# default build always uses the dependency-free `StubWeightUpdater`.
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }

[features]
# Native LLM client (issue #50). Non-default so the published build stays lean.
# Issue #39 adds the native Claude Anthropic Messages API tool-loop, which pulls
# in `reqwest` (blocking HTTP transport) and `glob` (the Glob tool executor).
llm = ["dep:rig-core", "dep:reqwest", "dep:glob", "dep:schemars"]
# OS-level Landlock filesystem sandbox (issue #140, stage 2). Non-default and
# Linux-only at runtime; on other platforms / old kernels it degrades to a
# logged no-op. Kept off the default build so no new dependency is pulled in.
landlock-sandbox = ["dep:landlock"]
# OS-level seccomp network-egress filter (issue #140, stage 2b). Non-default and
# Linux-only at runtime; on other platforms / kernels without seccomp it degrades to
# a logged no-op. Kept off the default and `llm` builds so no new dependency is pulled
# in, and (like `landlock-sandbox`) NOT built in CI — verified locally instead. When
# `Capabilities.allow_network` is false, installs a seccomp-bpf filter that fails the
# network-creating syscalls (socket/connect/...) with EACCES while allowing everything
# else, so the Python child keeps running. See `src/sandbox.rs::seccomp_support`.
seccomp-sandbox = ["dep:seccompiler", "dep:libc"]
# Native-Rust Candle LoRA weight-update backend (issue #139). NON-DEFAULT and
# intentionally NOT built in CI: the `candle-*` crates are not in the offline
# cargo cache, so enabling this requires network to fetch them. The default and
# `llm` builds are unaffected; with the feature off, the closed loop transparently
# uses `StubWeightUpdater`. See `src/weights.rs` for the (TODO-marked) skeleton.
weight-updates = ["dep:candle-core", "dep:candle-nn"]

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
criterion = "0.5"

[[bench]]
name = "core"
harness = false

[profile.dev]
opt-level = 0
