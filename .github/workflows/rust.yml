name: Rust CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Clippy (llm feature)
        run: cargo clippy --all-targets --features llm -- -D warnings

      - name: Test (llm feature)
        run: cargo test --all-targets --features llm

  parity:
    # Cross-language gate: the reference Python implementation and the Rust port
    # must produce byte-identical output on the same inputs (issue #29/#30).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install Python test deps
        run: uv pip install --system pydantic fastapi uvicorn httpx pytest

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build parity helper
        run: cargo build --bin sia-parity

      - name: Python reference test suite
        run: python -m pytest -q

      - name: Differential parity (Python ⇄ Rust)
        run: python scripts/parity_check.py

  evals:
    # dsrs (dspy-rs) eval harness — standalone crate, must build + pass offline.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            evals/target
          key: ${{ runner.os }}-evals-${{ hashFiles('evals/Cargo.lock') }}

      - name: Format check (evals)
        run: cargo fmt --manifest-path evals/Cargo.toml --all -- --check

      - name: Test evals (offline, no API keys)
        env:
          OPENAI_API_KEY: ""
          ANTHROPIC_API_KEY: ""
        run: cargo test --manifest-path evals/Cargo.toml
